<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FC27 Sniper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 340px;
      background: #0a0a0f;
      color: #e0e0e0;
      font-family: 'Segoe UI', sans-serif;
      font-size: 13px;
    }

    .header {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      padding: 14px 16px;
      border-bottom: 1px solid #00d4ff33;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header h1 {
      font-size: 15px;
      font-weight: 700;
      color: #00d4ff;
      letter-spacing: 1px;
    }

    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #444;
      transition: background 0.3s;
    }
    .status-dot.active { background: #00ff88; box-shadow: 0 0 6px #00ff88; }
    .status-dot.error  { background: #ff4444; box-shadow: 0 0 6px #ff4444; }

    .section {
      padding: 12px 16px;
      border-bottom: 1px solid #1a1a2e;
    }

    .section-title {
      color: #00d4ff;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    label {
      display: block;
      color: #888;
      font-size: 11px;
      margin-bottom: 4px;
      margin-top: 8px;
    }

    input, select {
      width: 100%;
      padding: 7px 10px;
      background: #111827;
      border: 1px solid #2a2a3e;
      border-radius: 4px;
      color: #e0e0e0;
      font-size: 12px;
      transition: border-color 0.2s;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #00d4ff66;
    }

    .row { display: flex; gap: 8px; }
    .row > div { flex: 1; }

    .btn {
      width: 100%;
      padding: 9px;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 1px;
      transition: all 0.2s;
      margin-top: 4px;
    }

    .btn-start {
      background: linear-gradient(135deg, #00d4ff, #0088cc);
      color: #000;
    }
    .btn-start:hover { filter: brightness(1.2); }

    .btn-stop {
      background: linear-gradient(135deg, #ff4444, #cc2222);
      color: #fff;
      display: none;
    }
    .btn-stop:hover { filter: brightness(1.2); }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-top: 4px;
    }

    .stat-box {
      background: #111827;
      border: 1px solid #1a2a3e;
      border-radius: 4px;
      padding: 8px;
      text-align: center;
    }

    .stat-value {
      font-size: 18px;
      font-weight: 700;
      color: #00d4ff;
    }

    .stat-label {
      font-size: 10px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .log-box {
      background: #050510;
      border: 1px solid #1a1a2e;
      border-radius: 4px;
      height: 100px;
      overflow-y: auto;
      padding: 6px 8px;
      font-family: 'Courier New', monospace;
      font-size: 10px;
      line-height: 1.6;
    }

    .log-entry { color: #666; }
    .log-entry.buy { color: #00ff88; }
    .log-entry.miss { color: #ff9944; }
    .log-entry.err { color: #ff4444; }
    .log-entry.info { color: #00d4ff; }

    .auth-status {
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 11px;
      background: #1a0a0a;
      border: 1px solid #ff444433;
      color: #ff8888;
      margin-top: 8px;
    }

    .auth-status.ok {
      background: #0a1a0a;
      border-color: #00ff8833;
      color: #88ff88;
    }

    .speed-preview {
      font-size: 10px;
      color: #555;
      text-align: right;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="status-dot" id="statusDot"></div>
    <h1>FC27 SNIPER</h1>
    <span style="margin-left:auto; font-size:10px; color:#444;" id="authBadge">NO AUTH</span>
  </div>

  <div class="section">
    <div class="section-title">Target Player</div>

    <label>Player Name (partial match)</label>
    <input type="text" id="playerName" placeholder="e.g. Mbappe, Haaland" />

    <div class="row">
      <div>
        <label>Position</label>
        <select id="position">
          <option value="">Any</option>
          <option value="GK">GK</option>
          <option value="CB">CB</option>
          <option value="LB">LB</option>
          <option value="RB">RB</option>
          <option value="CDM">CDM</option>
          <option value="CM">CM</option>
          <option value="CAM">CAM</option>
          <option value="LW">LW</option>
          <option value="RW">RW</option>
          <option value="ST">ST</option>
          <option value="CF">CF</option>
        </select>
      </div>
      <div>
        <label>Quality</label>
        <select id="quality">
          <option value="">Any</option>
          <option value="gold">Gold</option>
          <option value="silver">Silver</option>
          <option value="bronze">Bronze</option>
          <option value="totw_gold">TOTW Gold</option>
        </select>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Price Config</div>

    <div class="row">
      <div>
        <label>Max Buy Now (coins)</label>
        <input type="number" id="maxBuyNow" placeholder="e.g. 50000" min="200" step="50" />
      </div>
      <div>
        <label>Max Bid (coins)</label>
        <input type="number" id="maxBid" placeholder="optional" min="200" step="50" />
      </div>
    </div>

    <label>Min Profit Target (coins)</label>
    <input type="number" id="minProfit" placeholder="e.g. 5000 (after 5% tax)" value="0" min="0" />
  </div>

  <div class="section">
    <div class="section-title">Snipe Speed</div>

    <label>Search Interval</label>
    <select id="interval">
      <option value="300">Turbo — 300ms (risky)</option>
      <option value="500">Fast — 500ms</option>
      <option value="750" selected>Normal — 750ms</option>
      <option value="1000">Safe — 1000ms</option>
      <option value="1500">Slow — 1500ms</option>
    </select>
    <div class="speed-preview" id="speedPreview">~80 searches/min</div>

    <label>Auto-Buy Mode</label>
    <select id="autoBuyMode">
      <option value="buynow">Buy Now only (fastest)</option>
      <option value="bid">Bid only</option>
      <option value="both">Buy Now + Bid fallback</option>
    </select>
  </div>

  <div class="section">
    <div class="section-title">Stats</div>
    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-value" id="statSearches">0</div>
        <div class="stat-label">Searches</div>
      </div>
      <div class="stat-box">
        <div class="stat-value" id="statBuys" style="color:#00ff88">0</div>
        <div class="stat-label">Bought</div>
      </div>
      <div class="stat-box">
        <div class="stat-value" id="statProfit" style="color:#ffaa00">0</div>
        <div class="stat-label">Coins Saved</div>
      </div>
    </div>
  </div>

  <div class="section">
    <button class="btn btn-start" id="btnStart">&#9654; START SNIPER</button>
    <button class="btn btn-stop" id="btnStop">&#9632; STOP</button>
  </div>

  <div class="section">
    <div class="section-title">Live Log</div>
    <div class="log-box" id="logBox">
      <div class="log-entry info">[ FC27 Sniper ready — open FUT Web App first ]</div>
    </div>
  </div>

  <script src="src/popup.js"></script>
</body>
</html>
